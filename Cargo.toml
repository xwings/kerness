[workspace]
members = ["crates/kerness", "crates/kerness-py"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/xwings/kerness"

[workspace.dependencies]
fancy-regex = "0.14"
regex = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
shell-words = "1.1"
# No gzip: provider responses are JSON small enough that decompression buys
# nothing.
ureq = { version = "2.12", default-features = false, features = ["json", "tls"] }
# The event-level API, not a `Value` deserializer: frontmatter is read with
# YAML 1.1 scalar rules, where `no` is a boolean but `"no"` is a string, and a
# serde front end has already thrown away the quoting that decides which.
yaml-rust2 = { version = "0.11", default-features = false }

[profile.release]
lto = true
codegen-units = 1
strip = true

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "kerness"
description = "Kernel for harness — the framework multi-agent AI harnesses are built on"
# Symlinks to the repository root. `readme` and `license-files` resolve against
# this directory and reject a `..` path, so without them the wheel ships no
# licence text and no long description — and says nothing about it.
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
# Read from `[workspace.package] version` in the root Cargo.toml, so a release
# bumps one number. The extension re-exports it as `kerness.__version__`.
dynamic = ["version"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    # Linux and macOS only: path confinement resolves every path from `/`, so
    # the access boundary assumes POSIX paths.
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

[project.optional-dependencies]
structured = ["pydantic>=2,<3"]
dev = ["pytest>=7.0", "pydantic>=2,<3"]

[project.urls]
Homepage = "https://github.com/xwings/kerness"
Repository = "https://github.com/xwings/kerness"
Documentation = "https://github.com/xwings/kerness/blob/main/ARCHITECTURE.md"
Issues = "https://github.com/xwings/kerness/issues"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Pinned rather than left to the default, because the default is a moving
# target: a ruff release that widens it would fail CI on a commit that changed
# no Python. Widening the set here is a deliberate act, done together with the
# edits that make the tree pass it.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# `bootstrap` hands the extension the three things it cannot declare itself,
# and must run before any shim imports a name from it. Every import below that
# call is late by construction.
"kerness/__init__.py" = ["E402"]

[tool.maturin]
manifest-path = "Cargo.toml"
module-name = "kerness._core"
python-source = "."
features = ["pyo3/extension-module"]
# A local `maturin build` otherwise sweeps up whatever bytecode the working
# tree has lying around — cpython-313 `.pyc` files inside a wheel tagged for
# abi3 3.10 and up.
exclude = [{ path = "kerness/__pycache__/**", format = ["sdist", "wheel"] }]
include = [
    { path = "LICENSE", format = "sdist" },
    { path = "kerness/gameplans/*.md", format = "sdist" },
    { path = "kerness/roles/*.md", format = "sdist" },
    { path = "kerness/personas/*.md", format = "sdist" },
    { path = "kerness/skills/*/SKILL.md", format = "sdist" },
]

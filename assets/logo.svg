<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 220" width="740" height="220" role="img" aria-label="Kerness — Kernel for Harness">
  <title>Kerness — Kernel for Harness</title>
  <defs>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCD34D"/>
      <stop offset="0.55" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#EA580C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F59E0B" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="740" height="220" rx="28" fill="#0B1120"/>

  <!-- mark: a kernel, with six pluggable components bolted onto it -->
  <g transform="translate(18,10)">
    <circle cx="100" cy="100" r="96" fill="url(#glow)"/>

    <!-- carrier ring -->
    <polygon points="188,100 144,176.2 56,176.2 12,100 56,23.8 144,23.8"
             fill="none" stroke="#1E293B" stroke-width="2"/>

    <!-- spokes -->
    <g stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.55">
      <line x1="100" y1="62"     x2="100" y2="38"/>
      <line x1="132.91" y1="81"  x2="153.69" y2="69"/>
      <line x1="132.91" y1="119" x2="153.69" y2="131"/>
      <line x1="100" y1="138"    x2="100" y2="162"/>
      <line x1="67.09" y1="119"  x2="46.31" y2="131"/>
      <line x1="67.09" y1="81"   x2="46.31" y2="69"/>
    </g>

    <!-- pluggable components -->
    <g fill="#0B1120" stroke="#F59E0B" stroke-width="3">
      <rect x="90"     y="18"  width="20" height="20" rx="5"/>
      <rect x="152.35" y="54"  width="20" height="20" rx="5"/>
      <rect x="152.35" y="126" width="20" height="20" rx="5"/>
      <rect x="90"     y="162" width="20" height="20" rx="5"/>
      <rect x="27.65"  y="126" width="20" height="20" rx="5"/>
      <rect x="27.65"  y="54"  width="20" height="20" rx="5"/>
    </g>

    <!-- the kernel -->
    <polygon points="100,66 129.44,83 129.44,117 100,134 70.56,117 70.56,83"
             fill="url(#core)"/>
    <polygon points="100,80 112.99,87.5 112.99,102.5 100,110 87.01,102.5 87.01,87.5"
             fill="#0B1120" opacity="0.9"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
    <text x="236" y="126" font-size="82" font-weight="700" letter-spacing="-3" fill="#F8FAFC">kerness</text>
    <text x="240" y="162" font-size="17" font-weight="600" letter-spacing="6.2" fill="#F59E0B">KERNEL FOR HARNESS</text>
  </g>
</svg>
